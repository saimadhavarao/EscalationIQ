services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: escalation
      POSTGRES_USER: escalation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-escalation_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escalation -d escalation"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      target: runtime
      args:
        INSTALL_ENCODER: ${INSTALL_ENCODER:-0}
    environment:
      DATABASE_URL: postgresql+psycopg://escalation:${POSTGRES_PASSWORD:-escalation_dev}@db:5432/escalation
      ALERT_COOLDOWN_MINUTES: ${ALERT_COOLDOWN_MINUTES:-45}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - encoder_cache:/cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 15
  train:
    profiles: ["training"]
    build:
      context: .
      target: training
    volumes:
      - ./artifacts:/app/artifacts
      - encoder_cache:/cache/huggingface
volumes:
  pgdata:
  encoder_cache:
